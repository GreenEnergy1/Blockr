<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141b22"/>
      <stop offset="100%" stop-color="#080a0d"/>
    </linearGradient>
    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#182229"/>
      <stop offset="100%" stop-color="#10161b"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>

  <!-- shield -->
  <g filter="url(#glow)">
    <path d="M512 168
             L 730 246
             L 730 520
             C 730 686 636 792 512 856
             C 388 792 294 686 294 520
             L 294 246
             Z"
          fill="url(#shieldFill)"
          stroke="#22c55e"
          stroke-width="14"
          stroke-linejoin="round"/>
  </g>

  <!-- block glyph: ring + diagonal bar -->
  <g filter="url(#glow)">
    <circle cx="512" cy="508" r="132" fill="none" stroke="#22c55e" stroke-width="34"/>
    <line x1="424" y1="596" x2="600" y2="420" stroke="#22c55e" stroke-width="34" stroke-linecap="round"/>
  </g>
</svg>
